services:
  postgres:
    image: postgres:16
    container_name: alumniconnect-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: alumniconnect
      POSTGRES_USER: alumniconnect
      POSTGRES_PASSWORD: alumniconnect_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: